baseURL = 'https://notex.cc/'
locale = 'zh-cn'
title = 'Notex'
theme = 'hugo-coder'

[security.http]
urls = ['^https://cdn\.jsdelivr\.net/']

[pagination]
pagerSize = 20

[services]
[services.disqus]
shortname = "yourdiscussshortname"

[markup.highlight]
style = "github-dark"

[params]
  author = "哆啦 N 梦"
  info = "哆啦 N 梦的百宝箱"
  description = "哆啦 N 梦的百宝箱"
  keywords = "blog,developer,personal,AI"
  avatarurl = "images/avatar.webp"
  #gravatar = "cy198706@gmail.com"

  faviconSVG = "images/favicon.svg"
  favicon_32 = "images/favicon-32x32.png"
  favicon_16 = "images/favicon-16x16.png"
  touchIcon = "images/favicon.png"

  since = 2019

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/serious198706/"
[[params.social]]
  name = "Twitter"
  icon = "fa-brands fa-x-twitter fa-2x"
  weight = 3
  url = "https://twitter.com/serious008/"

# Menu links
[[menu.main]]
  name = "Blog"
  weight = 1
  url  = "posts/"
[[menu.main]]
  name = "About"
  weight = 2
  url = "about/"

# cache
[caches]
  [caches.images]
    dir = ':cacheDir/images'